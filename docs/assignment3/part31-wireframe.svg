<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
<title id="title">PausePath early low-stimulus app wireframe</title>
<desc id="desc">Three screens: choose short skill; one breathing instruction; finish or review. Persistent crisis information across all three.</desc>
<defs>
 <style><![CDATA[
 .bg{fill:#f2f5f4}.panel{fill:#fff;stroke:#bfcfcb;stroke-width:2}.nav{fill:#e8eeeb}.ink{fill:#273c38}.muted{fill:#61736f}.soft{fill:#e5eeea}.outline{fill:#fff;stroke:#75958a;stroke-width:2}.accent{fill:#1f6458}.white{fill:#fff}.hair{stroke:#d7e2dc;stroke-width:2}
 .label{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#2c4a41}.headline{font-family:Arial,sans-serif;font-size:28px;font-weight:700;fill:#273c38}.body{font-family:Arial,sans-serif;font-size:20px;fill:#273c38}.small{font-family:Arial,sans-serif;font-size:16px;fill:#61736f}.button{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#fff}.buttondark{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#31574d}
 ]]></style>
</defs>
<rect class="bg" width="1440" height="920"/>
<text x="64" y="60" class="headline">PausePath — early wireframe (Assignment 3.1)</text>
<text x="64" y="90" class="small">Coursework prototype • Fictional testing only • Not a mental health service</text>
<!-- phone 1 -->
<rect x="60" y="136" width="410" height="680" rx="23" class="panel"/>
<rect x="61" y="137" width="408" height="88" rx="22" class="nav"/>
<text x="90" y="172" class="label">PausePath</text>
<rect x="293" y="151" width="153" height="45" rx="11" fill="#d6e6df" stroke="#779d91"/>
<text x="314" y="180" class="buttondark">Crisis info</text>
<text x="90" y="266" class="headline">Choose one small step</text>
<text x="90" y="296" class="small">You can leave whenever you want.</text>
<rect x="90" y="337" width="350" height="112" rx="15" class="outline"/>
<text x="115" y="377" class="label">4–6 breathing</text>
<text x="115" y="408" class="small">In 4 · Out 6 · About 60 seconds</text>
<rect x="90" y="465" width="350" height="112" rx="15" class="outline"/>
<text x="115" y="505" class="label">STOP</text>
<text x="115" y="537" class="small">Four simple steps · About 60 seconds</text>
<rect x="90" y="610" width="350" height="54" rx="14" class="soft"/>
<text x="134" y="644" class="buttondark">Optional: Help me choose</text>
<text x="90" y="714" class="small">Simpler view [off]</text>
<text x="90" y="772" class="small">Home / skill choice screen</text>
<!-- phone 2 -->
<rect x="516" y="136" width="410" height="680" rx="23" class="panel"/>
<rect x="517" y="137" width="408" height="88" rx="22" class="nav"/>
<text x="545" y="172" class="label">4–6 breathing</text>
<rect x="748" y="151" width="153" height="45" rx="11" fill="#d6e6df" stroke="#779d91"/>
<text x="769" y="180" class="buttondark">Crisis info</text>
<text x="545" y="278" class="small">Cycle 3 of 6 • One action at a time</text>
<circle cx="720" cy="438" r="108" fill="#e1eee8" stroke="#85a99e" stroke-width="3"/>
<circle cx="720" cy="438" r="75" fill="none" stroke="#a7c4b9" stroke-width="5" stroke-dasharray="9 14"/>
<text x="720" y="420" text-anchor="middle" class="headline">Breathe in</text>
<text x="720" y="476" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:53px;font-weight:700;fill:#1f6458">4</text>
<text x="720" y="568" text-anchor="middle" class="small">Text count remains if motion is off</text>
<rect x="545" y="609" width="166" height="55" rx="14" class="soft"/>
<text x="602" y="644" class="buttondark">Pause</text>
<rect x="727" y="609" width="170" height="55" rx="14" class="outline"/>
<text x="754" y="644" class="buttondark">Stop / Leave</text>
<text x="545" y="714" class="small">No typing needed • Quiet visual cue</text>
<text x="545" y="772" class="small">Active exercise screen</text>
<!-- phone 3 -->
<rect x="972" y="136" width="410" height="680" rx="23" class="panel"/>
<rect x="973" y="137" width="408" height="88" rx="22" class="nav"/>
<text x="1001" y="172" class="label">PausePath</text>
<rect x="1204" y="151" width="153" height="45" rx="11" fill="#d6e6df" stroke="#779d91"/>
<text x="1225" y="180" class="buttondark">Crisis info</text>
<text x="1001" y="276" class="headline">You've reached the end</text>
<text x="1001" y="310" class="small">No rating or reflection required.</text>
<rect x="1001" y="355" width="350" height="64" rx="15" class="accent"/>
<text x="1092" y="395" class="button">Choose another</text>
<rect x="1001" y="435" width="350" height="64" rx="15" class="outline"/>
<text x="1098" y="475" class="buttondark">Save to history</text>
<rect x="1001" y="515" width="350" height="64" rx="15" class="soft"/>
<text x="1150" y="555" text-anchor="middle" class="buttondark">Leave</text>
<line x1="1001" y1="613" x2="1351" y2="613" class="hair"/>
<text x="1001" y="648" class="label">Your saved activity</text>
<text x="1001" y="679" class="small">Only appears when you choose to save</text>
<text x="1001" y="716" class="small">Repeat last: 4–6 breathing</text>
<text x="1001" y="772" class="small">Completion / optional history view</text>
<text x="60" y="875" class="small">Research-informed sketch, not a screenshot of a working application. Crisis info remains visible on every screen; AI suggestion is optional.</text>
</svg>